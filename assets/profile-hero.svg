<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title description">
  <title id="title">CurioCrafter — Andrew Rainsberger</title>
  <desc id="description">Game systems, Blender tools, and interactive worlds. I build the tool, the world, and the proof it works.</desc>
  <defs>
